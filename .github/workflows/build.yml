name: Build, Deploy

# on: [ push, pull_request ]
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Decode Keystore
        id: decode_keystore
        # 未配置签名 secrets 时跳过，构建回退 debug 签名。
        # 不再限 tag：所有构建统一签名，保证任何两版构建都能互相覆盖升级。
        continue-on-error: true
        uses: timheuer/base64-to-file@v2
        with:
          fileName: ${{ vars.RELEASE_KEYSTORE }}
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Generate keystore.properties
        run: |
          if [ -n "${{ secrets.RELEASEKEYPASSWORD }}" ]; then
            echo keystore.file="${{ vars.RELEASE_KEYSTORE }}" >> keystore.properties
            echo keystore.password="${{ secrets.RELEASESTOREPASSWORD }}" >> keystore.properties
            echo keystore.key.alias="${{ vars.RELEASE_KEY_ALIAS }}" >> keystore.properties
            echo keystore.key.password="${{ secrets.RELEASEKEYPASSWORD }}" >> keystore.properties
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Read Output Metadata
        id: read_output_metadata
        uses: juliangruber/read-file-action@v1
        with:
          path: ./app/build/outputs/apk/release/output-metadata.json
          trim: true

      - name: Upload Release Package
        env:
          version_code: ${{ fromJSON(steps.read_output_metadata.outputs.content).elements[0].versionCode }}
          version_name: ${{ fromJSON(steps.read_output_metadata.outputs.content).elements[0].versionName }}
        uses: actions/upload-artifact@v4
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        with:
          name: "release-${{ env.version_name }}(${{ env.version_code }})"
          path: ./app/build/outputs/apk/release

      # 手动/每周自动构建（非 tag）发布到滚动 Release：手机端无需登录即可下载 APK，
      # 同名产物每次构建覆盖，只保留最新一版。
      - name: Publish to rolling release
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: TiebaLite 最新构建
          prerelease: true
          body: |
            由 GitHub Actions 自动构建，commit `${{ github.sha }}`

            - 构建方式：${{ github.event_name }}
            - 签名固定，可直接覆盖安装后续构建（含官方原作与上一版本 fork）
            - 版本号见 APK 文件名
          files: ./app/build/outputs/apk/release/*.apk

      - name: Upload Release Package to public
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./app/build/outputs/apk/release/*.apk

      - name: Upload Mapping to public
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./app/build/outputs/mapping/release/mapping.txt
